name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match package version {version!r}")
          PY
      - name: Run tests, lint, and type checks
        run: uv run --locked tox
      - name: Build wheel and source distribution
        run: uv build --no-sources --clear
      - name: Check package metadata
        run: uv run --locked twine check --strict dist/*
      - name: Smoke test installed wheel
        run: |
          uv venv /tmp/jev-reranker-wheel-test --python 3.11
          uv pip install --python /tmp/jev-reranker-wheel-test/bin/python --exclude-newer "1 week" dist/*.whl
          cd /tmp
          /tmp/jev-reranker-wheel-test/bin/python - <<'PY'
          import asyncio
          import json
          from importlib.metadata import version
          from importlib.util import find_spec
          import httpx
          import jev_reranker
          from jev_reranker import ConfigurationError, HuggingFaceTokenizer, JevReranker, RELEVANCE_INSTRUCTION

          assert find_spec("tokenizers") is None
          assert find_spec("huggingface_hub") is None

          def respond(request):
              payload = json.loads(request.content)
              return httpx.Response(200, json={
                  "model": "offline",
                  "answers": {key: {"type": "noul", "noul": 0.5} for key in payload["questions"]},
                  "usage": {"input_tokens": 1, "output_tokens": 1},
              })

          def ranker():
              return JevReranker(api_key="offline-wheel-check", dotenv_path=None,
                                 transport=httpx.MockTransport(respond))

          with ranker() as reranker:
              assert reranker.rerank("query", ["document"])["results"][0]["document_index"] == 0
              assert reranker.relevance_rerank("query", ["document"])["results"][0]["score"] == 0.5
              raw = reranker.rerank("query", ["document"], instruction=RELEVANCE_INSTRUCTION,
                                         threshold=0.8, detail=True)
              assert raw["results"] == []
              assert raw["detail"]["documents"][0]["passes_threshold"] is False

          async def check_async():
              async with ranker() as reranker:
                  assert (await reranker.a_rerank("query", ["document"]))["results"][0]["document_index"] == 0
                  assert (await reranker.a_relevance_rerank("query", ["document"]))["results"][0]["score"] == 0.5
                  raw = await reranker.a_rerank("query", ["document"], detail=True)
                  assert raw["results"][0]["detail"]["original_length"] == 8
                  assert raw["detail"]["configuration"]["tokenizer"] is None

          asyncio.run(check_async())
          try:
              HuggingFaceTokenizer()
          except ConfigurationError as exc:
              assert "jev-reranker[tokenizer]" in str(exc)
          else:
              raise AssertionError("Tokenizer dependencies unexpectedly available")
          print(f"Installed jev-reranker {version('jev-reranker')}: {jev_reranker.__file__}")
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
