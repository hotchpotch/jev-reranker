[project]
name = "jev-reranker"
version = "0.0.1"
description = "JEV reranker Python package"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "tox>=4.61.4",
    "tox-uv>=1.36.0",
    "twine>=7.0.0",
    "ty>=0.0.80",
]

[tool.uv]
exclude-newer = "1 week"

[tool.tox]
legacy_tox_ini = """
[tox]
requires = tox-uv>=1.29.0
parallel = auto
parallel_show_output = true
env_list = py311, lint, type

[testenv]
deps = pytest
commands = pytest {posargs}

[testenv:lint]
deps = ruff
commands = ruff check .

[testenv:type]
deps = ty
commands = ty check
"""
