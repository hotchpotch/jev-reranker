[project]
name = "jev-reranker"
version = "0.1.3"
description = "Multilingual Jev reranking with listwise, pointwise, and pairwise scoring"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
tokenizer = ["huggingface-hub>=0.30,<2", "tokenizers>=0.21,<1"]
sentence-transformers = [
    "sentence-transformers>=5,<6",
]
all = [
    "huggingface-hub>=0.30,<2",
    "pyarrow>=20,<24",
    "sentence-transformers>=5,<6",
    "tokenizers>=0.21,<1",
]

[project.urls]
Homepage = "https://github.com/hotchpotch/jev-reranker"
Repository = "https://github.com/hotchpotch/jev-reranker"
Issues = "https://github.com/hotchpotch/jev-reranker/issues"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "huggingface-hub>=0.30,<2",
    "tokenizers>=0.21,<1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "tox>=4.67.13",
    "tox-uv>=1.37.7",
    "twine>=7.0.0",
    "ty>=0.0.99",
]
examples = [
    "pyarrow>=20,<24",
]

[tool.uv]
exclude-newer = "1 week"

[tool.tox]
legacy_tox_ini = """
[tox]
requires = tox-uv>=1.29.0
parallel = auto
parallel_show_output = true
env_list = py311, lint, type

[testenv]
extras = tokenizer
deps = pytest
commands = pytest tests examples/eval.py {posargs}

[testenv:lint]
runner = uv-venv-lock-runner
dependency_groups = dev
commands = ruff check .

[testenv:type]
runner = uv-venv-lock-runner
dependency_groups = dev
commands = ty check
"""

[tool.uv.build-backend]
source-include = ["examples/*.py", "examples/*.md", "docs/**", "tests/**", "scripts/*.py", ".env.sample", ".gitignore"]
source-exclude = [".env", ".live-results/**", "tests/__pycache__/**"]
